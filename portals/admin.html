<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#311536">
  <title>Administrator Portal · Teach Them to Love</title>
  <link rel="icon" href="/assets/img/t3l-logo.png" type="image/png">
  <!--
    SERVER-GATED ADMIN PORTAL
    This file is only a loader. It contains NO admin markup.
    The administrator interface is returned by the `t3l-portal` Supabase edge
    function (action: "app") ONLY after it verifies the caller holds a valid
    admin session (public.t3l_portal_members.role = 'admin'). A visitor without
    an admin session never receives the admin markup.
  -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap');
    :root{--plum:#4a214f;--gold:#d8ad5b;--gold-deep:#967027}
    html,body{height:100%}
    body{margin:0;font-family:'DM Sans',Arial,sans-serif;color:#fff;display:grid;place-items:center;text-align:center;padding:40px 22px;
      background:linear-gradient(160deg,#311536 0%,#4e2452 55%,#241128 100%)}
    .box{max-width:44ch}
    .logo{width:74px;height:74px;border-radius:50%;clip-path:circle(50%);object-fit:cover;margin:0 auto 18px;display:block}
    .eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:.72rem;font-weight:700;color:var(--gold);margin:0 0 10px}
    h1{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:clamp(1.5rem,5vw,2.1rem);margin:0 0 10px}
    p{opacity:.9;line-height:1.6;margin:0 auto 20px}
    .spin{width:34px;height:34px;border:3px solid rgba(255,255,255,.25);border-top-color:var(--gold);border-radius:50%;
      margin:6px auto 0;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:6px}
    .btn{display:inline-block;padding:12px 22px;border-radius:999px;font-weight:700;font-size:.95rem;text-decoration:none;cursor:pointer;border:0}
    .btn.gold{background:var(--gold);color:#221530}.btn.ghost{border:2px solid rgba(255,255,255,.65);color:#fff;background:transparent}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <main class="box" id="state">
    <img class="logo" src="/assets/img/t3l-logo.png" alt="Teach Them to Love">
    <p class="eyebrow">Administrator portal</p>
    <h1 id="stateTitle">Verifying your access…</h1>
    <p id="stateText">One moment while we confirm your administrator session.</p>
    <div class="spin" id="spin"></div>
    <div class="row" id="actions" hidden></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="/portals/auth.js"></script>
  <script>
  (function () {
    var titleEl = document.getElementById('stateTitle');
    var textEl = document.getElementById('stateText');
    var spin = document.getElementById('spin');
    var actions = document.getElementById('actions');

    function setState(title, text, buttons) {
      titleEl.textContent = title; textEl.textContent = text;
      spin.hidden = true; actions.innerHTML = ''; actions.hidden = !(buttons && buttons.length);
      (buttons || []).forEach(function (b) {
        var el = document.createElement(b.href ? 'a' : 'button');
        el.className = 'btn ' + (b.kind || 'ghost'); el.textContent = b.label;
        if (b.href) el.href = b.href; else el.addEventListener('click', b.onClick);
        actions.appendChild(el);
      });
    }

    (async function () {
      var sb;
      try { sb = T3L_AUTH.client(); } catch (e) {
        setState('Could not load', 'The sign-in service failed to load. Please refresh the page.', []);
        return;
      }
      var session;
      try { var s = await sb.auth.getSession(); session = s.data && s.data.session; } catch (e) {}
      if (!session) { location.href = T3L_AUTH.LOGIN_PATH; return; }

      // Ask the server for the admin interface. It returns the markup ONLY for a verified admin.
      var res = await T3L_AUTH.callFn('app', {});
      if (res.ok && res.data && res.data.html) {
        document.open(); document.write(res.data.html); document.close();
        return;
      }
      if (res.status === 401) { location.href = T3L_AUTH.LOGIN_PATH; return; }
      if (res.status === 403) {
        setState('Not authorized',
          'Your account is signed in but does not have administrator access. If you’re a member, open the client portal instead.',
          [{ label: 'Go to client portal', kind: 'gold', href: T3L_AUTH.CLIENT_PATH },
           { label: 'Sign out', kind: 'ghost', onClick: T3L_AUTH.signOut }]);
        return;
      }
      setState('Something went wrong',
        'We couldn’t load the administrator portal just now. Please try again in a moment.',
        [{ label: 'Retry', kind: 'gold', onClick: function () { location.reload(); } },
         { label: 'Sign out', kind: 'ghost', onClick: T3L_AUTH.signOut }]);
    })();
  })();
  </script>
</body>
</html>
